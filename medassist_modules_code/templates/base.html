
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MedAssist AI</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #182230;
            margin: 0;
        }

        header {
            background: #1769aa;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        header a {
            color: white;
            margin-right: 14px;
            text-decoration: none;
        }

        main {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 16px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 3px 16px #13294b12;
            margin-bottom: 18px;
        }

        input, select, textarea {
            display: block;
            width: 100%;
            padding: 11px;
            margin: 7px 0 15px;
            border: 1px solid #ccd5df;
            border-radius: 7px;
        }

        button, .btn {
            background: #1769aa;
            color: white;
            padding: 10px 16px;
            border: 0;
            border-radius: 7px;
            text-decoration: none;
            cursor: pointer;
            display: inline-block;
        }

        .message {
            padding: 10px;
            border-radius: 7px;
            background: #e9f4ff;
            margin: 10px 0;
        }

        .error {
            background: #ffecec;
        }

        .muted {
            color: #5d6875;
        }

        .symptom {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            padding: 9px 12px;
            background: #f3f7fb;
            border-radius: 8px;
            margin: 5px;
        }

        .symptom input {
            width: auto;
            margin: 0;
        }

        ul {
            line-height: 1.8;
        }

        .logout-form {
            display: inline;
        }

        .logout-form button {
            background: transparent;
            color: white;
            padding: 0;
            font-size: 15px;
        }
    </style>
</head>
<body>

<header>
    <strong>MedAssist AI</strong>

    <nav>
        {% if user.is_authenticated %}
            <a href="{% url 'profile_detail' %}">Profile</a>
            <a href="{% url 'symptom_selection' %}">Symptom Analysis</a>
            <a href="{% url 'medical_history_list' %}">Medical History</a>
            <a href="{% url 'assessment_history' %}">Assessments</a>

            <form method="post" action="{% url 'logout' %}" class="logout-form">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Login / Register</a>
        {% endif %}
    </nav>
</header>

<main>
    {% if messages %}
        {% for message in messages %}
            <div class="message {% if message.tags == 'error' %}error{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</main>

</body>
</html>
