{% extends "base.html" %}
{% block content %}
<div class="card">

    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save profile</button>
  </form>
  <p><a href="{% url 'profile_detail' %}">Back to profile</a></p>
</div>
{% endblock %}
